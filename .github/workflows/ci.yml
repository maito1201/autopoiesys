name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Add Claude Code to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate plugin marketplace
        run: claude plugin validate --strict .

      - name: Check declared skill paths exist
        run: |
          jq -r '.plugins[].skills[]' .claude-plugin/marketplace.json | while read -r p; do
            test -d "$p" || { echo "skills に宣言されたパスが無い: $p" >&2; exit 1; }
          done

      - name: Codex 用 manifest が JSON として読める
        run: |
          jq -e '.name and .version and .skills' .codex-plugin/plugin.json
          jq -e '.plugins[0].source.url' .agents/plugins/marketplace.json
